<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido: tu plataforma de alumno · Escuela de Barbería en Piura</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Mira tu plataforma de alumno · Escuela de barbería en Piura · Callao For Men">
<meta property="og:description" content="Recorre la cuenta que tendrás como alumno: tus 48 clases, tu cronograma de pagos y tu asistencia, desde tu celular.">
<meta name="description" content="Recorrido de la plataforma del alumno de la Escuela de Barbería Callao For Men en Piura.">
<meta property="og:image" content="https://callaoformen.github.io/escuela/img/og.jpg">
<link rel="icon" href="../img/logo.png">
<link rel="apple-touch-icon" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0a08;--bg:#100e0a;--panel:#18150f;--panel-2:#211c13;--panel-3:#2a2418;--line:#3a3020;
  --gold:#e3a72f;--gold-soft:#f3cf7a;--text:#f6f1e8;--muted:#b9ae9a;--dim:#857a67;
  --ok:#5cc98a;--warn:#f0b43c;--bad:#ef5b5b;--info:#7aa7ff;--wa:#25d366;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --r:18px;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1.1;margin:0;font-weight:600}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .gold{color:var(--gold)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 80% at 50% 0%,#2a2010 0%,var(--bg) 60%)}
.login-card{width:100%;max-width:400px;text-align:center}
.login-card img{width:110px;height:110px;object-fit:contain;margin:0 auto 14px}
.login-card h1{font-size:30px}
.login-card h1 span{color:var(--gold)}
.login-card p{color:var(--muted);margin:8px 0 22px}
.pin{width:100%;height:62px;border-radius:16px;border:2px solid var(--line);background:var(--panel);text-align:center;font-family:var(--display);font-size:30px;letter-spacing:.5em;padding-left:.5em}
.pin:focus{border-color:var(--gold);outline:none}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;text-align:left}
.role{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.role b{display:block;font-family:var(--display);text-transform:uppercase;font-size:14px;color:var(--gold-soft);letter-spacing:.04em}
.role span{font-size:13px;color:var(--muted)}
.demo-note{margin-top:18px;font-size:13px;color:var(--muted);background:rgba(227,167,47,.08);border:1px dashed var(--gold);border-radius:12px;padding:10px 12px}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn-gold{background:var(--gold);color:#1a1205}
.btn-gold:active{filter:brightness(.92)}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--text)}
.btn-line{background:transparent;border:2px solid var(--gold);color:var(--gold-soft)}
.btn-wa{background:var(--wa);color:#06230f}
.btn-bad{background:transparent;border:2px solid rgba(239,91,91,.5);color:#ff8a8a}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 14px;font-size:13px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px}

/* ---------- Estructura ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(16,14,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:62px}
.topbar img{width:38px;height:38px;object-fit:contain}
.topbar .who{flex:1;min-width:0}
.topbar .who small{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold)}
.topbar .who b{display:block;font-family:var(--display);text-transform:uppercase;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.demo-bar{background:#2b200b;color:var(--gold-soft);font-size:13px;text-align:center;padding:6px 12px;border-bottom:1px solid #4a3812}
main{padding:18px 0 110px;overflow-x:hidden}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,12,9,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;justify-content:space-around;padding:0 4px}
.nav button{flex:1;background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-family:var(--display);text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--gold)}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.page-title h1{font-size:clamp(26px,6vw,34px)}
.page-title p{margin:4px 0 0;color:var(--muted)}
.kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--gold);margin:0 0 4px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:20px}
.sec-h .link{background:none;border:0;color:var(--gold-soft);font-family:var(--display);text-transform:uppercase;font-size:13px;letter-spacing:.06em}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
@media(min-width:720px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2-lg{grid-template-columns:1fr 1fr}}

/* ---------- Héroe del dueño ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#2a1f0c,#17130d 70%);border:1px solid #4a3812;border-radius:22px;padding:18px}
.ring{--p:0;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#2f2717 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:#1a150d}
.ring div{position:relative;text-align:center;line-height:1}
.ring b{display:block;font-family:var(--display);font-size:34px;color:var(--gold-soft)}
.ring span{font-size:12px;color:var(--muted)}
.hero h2{font-size:22px}
.hero p{margin:6px 0 0;color:var(--muted);font-size:15px}
.mini-ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--c,var(--ok)) calc(var(--p)*1%),#2f2717 0);display:grid;place-items:center;position:relative;flex:0 0 auto}
.mini-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
.mini-ring b{position:relative;font-family:var(--display);font-size:15px}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.stat .lab{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-family:var(--display);font-size:28px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .hint{font-size:12px;color:var(--dim);margin-top:2px}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--gold))}

/* Hoy hay clase */
.today{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.today::-webkit-scrollbar{display:none}
.today-card{flex:0 0 auto;min-width:220px;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.today-card .t{font-family:var(--display);text-transform:uppercase;font-size:16px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel-3);color:var(--muted);white-space:nowrap}
.b-ok{background:rgba(92,201,138,.14);color:#8be0ae}
.b-warn{background:rgba(240,180,60,.15);color:#f5c869}
.b-bad{background:rgba(239,91,91,.16);color:#ff8f8f}
.b-info{background:rgba(122,167,255,.15);color:#a9c4ff}
.b-gold{background:rgba(227,167,47,.16);color:var(--gold-soft)}

/* Alertas */
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left}
.alert .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.alert .tx{flex:1;min-width:0}
.alert .tx b{display:block;font-weight:600}
.alert .tx span{font-size:13px;color:var(--muted)}
.ok-empty{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:rgba(92,201,138,.08);border:1px solid rgba(92,201,138,.25);color:#a8e6c2}

/* Tarjetas de turno */
.turno-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.turno-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tc)}
.turno-card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.turno-card h3{font-size:19px}
.turno-card .when{color:var(--muted);font-size:14px;margin-top:3px}
.turno-card .meta{display:flex;flex-wrap:wrap;gap:6px}
.modbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--panel-3)}
.modbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--mc);margin-right:5px;vertical-align:-1px}

/* Barras por módulo */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar-row .track{height:14px;background:var(--panel-3);border-radius:99px;overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:99px;background:var(--mc)}

/* Turno detalle */
.t-hero{border-radius:22px;padding:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 22%,#18150f),#15120c 75%);border:1px solid color-mix(in srgb,var(--tc) 45%,#3a3020)}
.t-hero h1{font-size:clamp(24px,6vw,32px)}
.t-hero .when{color:var(--text);opacity:.85;margin-top:4px}
.t-hero .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.t-hero .fact{background:rgba(0,0,0,.28);border-radius:14px;padding:10px;text-align:center}
.t-hero .fact b{display:block;font-family:var(--display);font-size:24px}
.t-hero .fact span{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:999px;margin:16px 0}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:999px;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1205}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-soft);background:rgba(227,167,47,.12)}

.mod-sec{border-left:4px solid var(--mc);background:var(--panel);border-radius:6px 18px 18px 6px;padding:14px 14px 12px;margin-bottom:12px}
.mod-sec .mh{display:flex;align-items:center;gap:10px}
.mod-num{width:40px;height:40px;border-radius:12px;background:var(--mc);color:#111;font-family:var(--display);font-size:20px;display:grid;place-items:center;flex:0 0 auto;font-weight:700}
.mod-sec .mh h3{font-size:16px}
.mod-sec .mh small{display:block;color:var(--muted);font-size:13px;font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400}
.mod-sec .cnt{margin-left:auto}
.temas{margin:10px 0 4px;font-size:13px;color:var(--muted)}
.temas summary{cursor:pointer;color:var(--gold-soft);font-weight:600;list-style:none}
.temas summary::-webkit-details-marker{display:none}
.temas ul{margin:8px 0 0;padding-left:18px}
.temas li{margin:3px 0}
.empty-mod{font-size:13px;color:var(--dim);padding:8px 0 2px}

.st{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.st:first-of-type{border-top:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:#111;background:var(--mc,var(--gold));flex:0 0 auto;font-weight:700}
.av.lg{width:64px;height:64px;font-size:22px}
.st .nm{flex:1;min-width:0}
.st .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .nm span{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--panel-3)}
.dot.A{background:var(--ok)}.dot.T{background:var(--warn)}.dot.F{background:var(--bad)}.dot.J{background:var(--info)}
.list-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 14px}

/* Asistencia */
.att-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.date-in{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 12px;color-scheme:dark}
.att-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.att-sum div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.att-sum b{display:block;font-family:var(--display);font-size:22px}
.att-sum span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.att-row{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.att-row:first-child{border-top:0}
.att-row .who{display:flex;align-items:center;gap:10px}
.att-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.att-btns button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;gap:2px}
.att-btns button i{font-style:normal;font-size:16px}
.att-btns button[aria-pressed="true"][data-e="A"]{background:var(--ok);color:#06210f;border-color:var(--ok)}
.att-btns button[aria-pressed="true"][data-e="T"]{background:var(--warn);color:#241703;border-color:var(--warn)}
.att-btns button[aria-pressed="true"][data-e="F"]{background:var(--bad);color:#2a0606;border-color:var(--bad)}
.att-btns button[aria-pressed="true"][data-e="J"]{background:var(--info);color:#071431;border-color:var(--info)}
@media(min-width:720px){.att-row{grid-template-columns:1fr 360px;align-items:center}}
.sticky-save .btn{min-width:0;white-space:normal;line-height:1.1;padding:0 12px;font-size:14px}
.sticky-save{position:sticky;bottom:78px;margin-top:14px;padding:10px;background:rgba(16,14,10,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;display:flex;gap:8px}
.notice{padding:12px 14px;border-radius:14px;font-size:14px;background:rgba(122,167,255,.1);border:1px solid rgba(122,167,255,.3);color:#c5d7ff}
.notice.warn{background:rgba(240,180,60,.1);border-color:rgba(240,180,60,.35);color:#f8d68a}
.help{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--muted)}
.help summary{cursor:pointer;color:var(--gold-soft);font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;list-style:none}
.help summary::-webkit-details-marker{display:none}
.help ol{margin:10px 0 0;padding-left:20px}
.help li{margin:6px 0}

/* Historial */
.hist{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.hist table{border-collapse:collapse;min-width:100%;font-size:13px}
.hist th,.hist td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.hist th{font-family:var(--display);font-weight:500;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.hist td:first-child,.hist th:first-child{text-align:left;position:sticky;left:0;background:var(--panel);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.cell{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:700}
.cell.A{background:rgba(92,201,138,.2);color:#8be0ae}.cell.T{background:rgba(240,180,60,.2);color:#f5c869}.cell.F{background:rgba(239,91,91,.22);color:#ff8f8f}.cell.J{background:rgba(122,167,255,.2);color:#a9c4ff}
.cell.n{color:var(--dim)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:10px 12px;color-scheme:dark}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt > span{display:block;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px;font-size:14px;min-height:48px}
.opt span small{display:block;color:var(--dim);font-size:12px}
.turn-pick{display:grid;grid-template-columns:1fr;gap:6px}
.turn-pick .opt > span{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px}
.turn-pick .opt > span i{font-style:normal;font-size:20px}
.turn-pick .opt span b{display:block;font-weight:600}
@media(min-width:560px){.turn-pick{grid-template-columns:1fr 1fr}}
.opt input:checked + span{border-color:var(--gold);background:rgba(227,167,47,.12);color:var(--gold-soft)}
.opt input:focus-visible + span{outline:3px solid var(--gold-soft)}
.mod-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mod-pick .opt > span{text-align:center;font-family:var(--display);font-size:18px;padding:10px 0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.switch input{width:48px;height:28px;appearance:none;background:var(--panel-3);border-radius:99px;position:relative;transition:.2s;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:23px}
.search{width:100%;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:0 18px}

/* Hoja inferior */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-h h2{flex:1;font-size:22px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line)}}

/* Perfil */
.prof-head{display:flex;gap:14px;align-items:center}
.prof-head h2{font-size:22px}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0 4px}
.step{text-align:center;font-size:11px;color:var(--dim)}
.step i{display:grid;place-items:center;height:34px;border-radius:10px;background:var(--panel-3);font-style:normal;font-family:var(--display);font-size:16px;color:var(--dim);margin-bottom:4px}
.step.done i{background:color-mix(in srgb,var(--mc) 35%,#1a1610);color:var(--text)}
.step.cur i{background:var(--mc);color:#111;box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 35%,transparent)}
.step.cur{color:var(--text);font-weight:600}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.box h3{font-size:15px;color:var(--gold-soft);margin-bottom:10px;letter-spacing:.05em}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kv div{background:var(--panel-2);border-radius:12px;padding:8px 2px}
.kv b{display:block;font-family:var(--display);font-size:20px}
.kv span{font-size:11px;color:var(--muted)}
.note-item{border-top:1px solid var(--line);padding:10px 0}
.note-item:first-child{border-top:0}
.note-item small{color:var(--dim)}
.pay-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.pay-row:first-child{border-top:0}
.progress{height:10px;background:var(--panel-3);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft))}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:#f6f1e8;color:#111;padding:12px 18px;border-radius:999px;font-weight:600;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad);color:#fff}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:sp 0.9s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.edu-card{display:flex;flex-direction:column;gap:10px}
.edu-card .row{display:flex;align-items:center;gap:12px}
.pinbox{font-family:var(--display);letter-spacing:.3em;font-size:18px;background:var(--panel-2);border-radius:10px;padding:6px 10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
/* Pagos: precio y cronograma */
.price-card{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.price-card .pc-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(227,167,47,.15);font-size:20px;flex:0 0 auto}
.price-card .pc-tx{flex:1;min-width:0}
.price-card .pc-tx b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.price-card .pc-tx span{display:block;font-size:12px;color:var(--muted)}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.sumrow div{background:var(--panel-2);border-radius:12px;padding:8px 4px}
.sumrow b{display:block;font-family:var(--display);font-size:17px}
.sumrow span{font-size:11px;color:var(--muted)}
.crono-t{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted);margin:16px 0 4px}
.crono-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.crono-row:first-of-type{border-top:0}
.crono-n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:var(--panel-3);color:var(--muted)}
.crono-row.pagada .crono-n{background:rgba(92,201,138,.2);color:#8be0ae}
.crono-row.vencida .crono-n{background:rgba(239,91,91,.22);color:#ff8f8f}
.crono-row.hoy .crono-n,.crono-row.proxima .crono-n{background:var(--gold);color:#1a1205}
.crono-row .cr-tx b{display:block;font-size:14px}
.crono-row .cr-tx span{font-size:12px;color:var(--muted)}
.crono-row .cr-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.crono-row .cr-r b{font-variant-numeric:tabular-nums}
.agenda-day{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--gold-soft);padding:12px 0 2px;display:flex;justify-content:space-between;gap:8px}
.agenda-day span{color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--body)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
/* Asistencia por fechas */
.as-turnos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.as-t{min-width:0}
.as-t .pend.b-ini{font-size:11px;padding:3px 7px}
@media(min-width:720px){.as-turnos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.as-t{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:14px;padding:10px 12px;min-height:58px}
.as-t b{display:block;font-size:14px;line-height:1.15}
.as-t span{font-size:12px;color:var(--muted)}
.as-t[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 18%,var(--panel));border-color:var(--tc)}
.as-t .ic{font-size:20px}
.as-t .pend{margin-left:auto;flex:0 0 auto}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-h h3{font-size:18px}
.cal-h .icon-btn:disabled{opacity:.3}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal-w{font-size:11px;text-align:center;color:var(--dim);font-family:var(--display);letter-spacing:.06em;padding-bottom:2px}
.cal-d{min-height:48px;border-radius:11px;border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;color:var(--dim);padding:2px 0;font-variant-numeric:tabular-nums}
.cal-d.clase{background:var(--panel-2);border-color:var(--line);color:var(--text);font-weight:600}
.cal-d.ok{background:rgba(92,201,138,.15);border-color:rgba(92,201,138,.5);color:#bff0d2}
.cal-d.pend{background:rgba(240,180,60,.14);border-color:rgba(240,180,60,.55);color:#f8d68a}
.cal-d.extra{background:rgba(122,167,255,.12);border-color:rgba(122,167,255,.4);color:#c5d7ff}
.cal-d.hoy{box-shadow:inset 0 0 0 2px var(--gold)}
.cal-d.sel{outline:3px solid var(--gold-soft);outline-offset:1px}
.cal-d.fut{opacity:.4}
.cal-d small{font-size:10px;font-weight:700;line-height:1}
.cal-d:disabled{cursor:default}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--muted)}
.cal-leg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.cal-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center}
.cal-sum div{background:var(--panel-2);border-radius:12px;padding:8px 4px}
.cal-sum b{display:block;font-family:var(--display);font-size:20px}
.cal-sum span{font-size:11px;color:var(--muted)}
.as-day{margin-top:16px;scroll-margin-top:76px}
/* Recorrido para interesados */
.rec-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(90deg,#3a2a0b,#21180a);border-bottom:1px solid #6b4f16}
.rec-bar .rb-tx{flex:1;min-width:0;font-size:13px;line-height:1.25;color:var(--gold-soft)}
.rec-bar .rb-tx b{display:block;color:var(--text);font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:13px;font-weight:600}
.rec-bar .btn{min-height:40px;padding:0 14px;font-size:13px}
.rec-bar .rb-tour{background:none;border:1px solid #6b4f16;color:var(--gold-soft);border-radius:999px;min-height:40px;padding:0 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tour-ov{position:fixed;inset:0;z-index:80;pointer-events:none}
.tour-ov.on{pointer-events:auto}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(5,4,2,.78);outline:3px solid var(--gold);outline-offset:3px;transition:all .3s ease;pointer-events:none}
.tour-card{position:fixed;left:12px;right:12px;max-width:460px;margin:0 auto;background:#1b160e;border:1px solid var(--gold);border-radius:20px;padding:16px 16px 14px;box-shadow:0 18px 50px rgba(0,0,0,.6);transition:top .3s ease,bottom .3s ease}
.tour-card .tc-step{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold)}
.tour-card h3{font-size:20px;margin:4px 0 6px}
.tour-card p{margin:0;color:var(--text);font-size:15px;line-height:1.45}
.tour-card .tc-dots{display:flex;gap:5px;margin:12px 0 0}
.tour-card .tc-dots i{width:7px;height:7px;border-radius:50%;background:var(--panel-3)}
.tour-card .tc-dots i.on{background:var(--gold);width:18px;border-radius:9px}
.tour-card .tc-btns{display:flex;gap:8px;margin-top:12px;align-items:center}
.tour-card .tc-btns .btn{min-height:44px}
.tour-card .tc-skip{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;margin-right:auto;padding:0}
.tour-card.center{top:50%;transform:translateY(-50%)}
.tour-card .tc-big{font-size:40px;line-height:1;margin-bottom:6px}
/* Clases del alumno (perfil) */
.cl-list{margin-top:8px}
.cl-row{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cl-row:first-child{border-top:0}
.cl-n{width:42px;height:42px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel-3);font-family:var(--display);font-size:15px;line-height:1;color:var(--muted)}
.cl-n small{font-size:9px;font-family:var(--body);letter-spacing:.04em}
.cl-row.A .cl-n{background:rgba(92,201,138,.2);color:#8be0ae}.cl-row.T .cl-n{background:rgba(240,180,60,.2);color:#f5c869}
.cl-row.F .cl-n{background:rgba(239,91,91,.22);color:#ff8f8f}.cl-row.J .cl-n{background:rgba(122,167,255,.2);color:#a9c4ff}
.cl-row.sin .cl-n{background:rgba(240,180,60,.12);color:#f8d68a;box-shadow:inset 0 0 0 1px rgba(240,180,60,.5)}
.cl-row.fut{opacity:.6}
.cl-tx b{display:block;font-size:14px}
.cl-tx span{font-size:12px;color:var(--muted)}
.cl-btns{display:flex;gap:4px}
.cl-btns button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:14px;font-weight:700;color:var(--muted)}
.cl-btns button[aria-pressed="true"][data-e="A"]{background:var(--ok);color:#06210f;border-color:var(--ok)}
.cl-btns button[aria-pressed="true"][data-e="T"]{background:var(--warn);color:#241703;border-color:var(--warn)}
.cl-btns button[aria-pressed="true"][data-e="F"]{background:var(--bad);color:#2a0606;border-color:var(--bad)}
.cl-btns button[aria-pressed="true"][data-e="J"]{background:var(--info);color:#071431;border-color:var(--info)}
.cl-btns button:disabled{opacity:.35}

/* Guía de clases */
.g-mods{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:12px}
.g-mod{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;cursor:pointer;min-height:56px}
.g-mod b{font-family:var(--display);font-size:20px;color:var(--mc);line-height:1}
.g-mod span{font-size:11px;line-height:1.1;text-align:center}
.g-mod[aria-pressed="true"]{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 16%,var(--panel));color:var(--text)}
.g-head{border:1px solid var(--line);border-radius:18px;padding:16px;background:radial-gradient(ellipse 80% 120% at 0% 0%,color-mix(in srgb,var(--mc) 22%,transparent),transparent 65%),var(--panel)}
.g-badge{display:inline-block;font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#120d05;background:var(--mc);border-radius:999px;padding:3px 10px}
.g-head h2{font-size:22px;margin:8px 0 6px}
.g-head p{margin:0;color:var(--text);font-size:14px}
.g-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.g-facts span{font-size:12px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.g-est{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px}
.g-est summary{cursor:pointer;color:var(--gold-soft);font-weight:600;list-style:none}
.g-est summary::-webkit-details-marker{display:none}
.g-est ol{margin:10px 0 0;padding-left:18px;display:grid;gap:8px}
.g-est li b{display:block;color:var(--text)}
.g-est li span{color:var(--muted)}
.g-list{display:grid;gap:8px}
.g-clase{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.g-clase[open]{border-color:var(--mc)}
.g-clase summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;min-height:56px}
.g-clase summary::-webkit-details-marker{display:none}
.g-n{flex:none;width:38px;height:38px;border-radius:10px;border:2px solid var(--mc);color:var(--mc);display:grid;place-items:center;font-family:var(--display);font-size:16px}
.g-clase.ev .g-n{background:var(--mc);color:#120d05}
.g-t{flex:1;font-weight:600;line-height:1.25}
.g-t small{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mc);font-weight:500}
.g-chev{color:var(--muted);font-size:20px;transition:transform .2s}
.g-clase[open] .g-chev{transform:rotate(90deg)}
.g-clase dl{margin:0;padding:0 14px 14px;display:grid;gap:10px}
.g-clase dt{font-size:12px;font-weight:700;color:var(--gold-soft);text-transform:uppercase;letter-spacing:.04em}
.g-clase dd{margin:2px 0 0;font-size:14px;color:var(--text)}
.g-clase .g-al dd{color:var(--muted)}
.g-evalm{margin-top:12px;border:1px dashed var(--mc);border-radius:14px;padding:12px 14px}
.g-evalm b{color:var(--mc);font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.g-evalm p{margin:4px 0 0;font-size:14px}

/* === Escuela de barbería en Piura (identidad visible en todas las páginas) === */
.pz-top{display:flex;align-items:center;justify-content:center;gap:6px 10px;flex-wrap:wrap;background:linear-gradient(90deg,#e3a72f,#f3cf7a 50%,#e3a72f);color:#1a1205;font-family:"Oswald","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:13px;font-weight:600;padding:8px 12px;text-align:center;line-height:1.2;position:relative;z-index:5}
.pz-top b{font-weight:700;font-size:14px}
.pz-top span{opacity:.8}
.pz-mid{display:flex;gap:12px;align-items:center;margin:30px 0 0;padding:14px 16px;border-radius:20px;border:1px solid #e3a72f;background:linear-gradient(135deg,rgba(227,167,47,.18),rgba(23,20,14,.92));color:#f6f1e8;text-align:left;font-family:"Barlow","Helvetica Neue",Arial,sans-serif}
.pz-mid .pz-pin{font-size:30px;line-height:1;flex:0 0 auto}
.pz-mid .pz-tx{flex:1;min-width:0}
.pz-mid .pz-tx b{display:block;font-family:"Oswald","Arial Narrow",Impact,sans-serif;text-transform:uppercase;font-size:18px;letter-spacing:.02em;color:#f3cf7a;line-height:1.15}
.pz-mid .pz-tx span{font-size:14px;color:#d8cdb9;display:block;margin-top:3px;line-height:1.35}
.pz-mid a{flex:0 0 auto;white-space:nowrap;font-weight:700;color:#1a1205;background:#f3cf7a;border-radius:999px;padding:8px 12px;font-size:13px;text-decoration:none}
.pz-mid .pz-pin{width:34px;text-align:center}
@media(max-width:560px){.pz-mid{flex-wrap:wrap;align-items:flex-start}.pz-mid .pz-tx{flex:1 1 calc(100% - 52px)}.pz-mid a{margin-left:46px}}
.pz-box{max-width:1100px;margin:0 auto;padding:0 20px}
.pz-end{text-align:center;padding:20px 16px 6px;margin-top:26px;border-top:1px solid #3a3020;color:#bdb29f;font-size:14px;line-height:1.4;font-family:"Barlow","Helvetica Neue",Arial,sans-serif}
.pz-end b{color:#f3cf7a;display:block;font-family:"Oswald","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:17px;margin-bottom:2px}
.badge.b-ini{background:rgba(46,196,182,.16);color:#7ee3d8;border:1px solid rgba(46,196,182,.45)}
.ini-box{display:flex;gap:12px;align-items:flex-start;margin:12px 0;padding:14px;border-radius:16px;border:1px solid rgba(46,196,182,.5);background:linear-gradient(135deg,rgba(46,196,182,.14),var(--panel))}
.ini-box .ini-ic{font-size:28px;line-height:1}
.ini-box > div > b{display:block}
.ini-box > div > span{font-size:14px;color:var(--muted);display:block;margin-top:2px}
.cal-d.ini{outline:2px solid #2ec4b6;outline-offset:-2px;background:rgba(46,196,182,.22)!important;color:var(--text)}
input.flash{box-shadow:0 0 0 3px rgba(46,196,182,.7)}
</style>

<div id="sheet" class="sheet-wrap" hidden></div>

<script>
/* Dirección del servidor de Google. Vacío = modo demostración (datos de ejemplo guardados en este celular). */
const API_URL = "";
</script>
<script>
/* ===== LÓGICA CENTRAL: la usan el modo demo y el servidor de Google ===== */
var CORE = (function () {
  var TURNO_IDS = ['LM-M', 'LM-T', 'MJ-M', 'MJ-T', 'SD-M', 'DFD'];
  var ESTADOS = ['A', 'T', 'F', 'J'];
  var CONCEPTOS = ['Mensualidad', 'Matrícula', 'Especialización', 'Otro'];
  var MEDIOS = ['Efectivo', 'Yape', 'Plin', 'Transferencia'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var hoyFn = null;
  function hoy() { if (hoyFn) return hoyFn(); var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function txt(v, max) { return String(v == null ? '' : v).trim().slice(0, max || 120); }
  function esFecha(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); }
  function err(m) { throw new Error(m); }
  function soloDueno(ses) { if (ses.role !== 'dueno') err('Solo el dueño puede hacer esto'); }
  function puede(ses, turno) { return ses.role === 'dueno' || (ses.role === 'educador' && ses.turnos.indexOf(turno) >= 0); }
  function buscar(lista, id) { for (var i = 0; i < lista.length; i++) if (String(lista[i].id) === String(id)) return lista[i]; return null; }
  function pinEnUso(db, pin, exceptoId) {
    if (pin === String(db.config.pinDueno)) return true;
    for (var i = 0; i < db.educadores.length; i++) if (String(db.educadores[i].pin) === pin && String(db.educadores[i].id) !== String(exceptoId)) return true;
    for (var j = 0; j < db.alumnos.length; j++) if (db.alumnos[j].pin && String(db.alumnos[j].pin) === pin && String(db.alumnos[j].id) !== String(exceptoId)) return true;
    return false;
  }
  function sinPin(a) { var o = {}; for (var k in a) if (k !== 'pin') o[k] = a[k]; return o; }
  function activo(v) { return !(v === false || v === 'false' || v === 'FALSE'); }

  function auth(db, pin) {
    pin = txt(pin, 12);
    if (!pin) return null;
    if (pin === String(db.config.pinDueno)) return { role: 'dueno', nombre: 'Dirección', turnos: TURNO_IDS.slice() };
    for (var i = 0; i < db.educadores.length; i++) {
      var e = db.educadores[i];
      if (String(e.pin) === pin && activo(e.activo)) {
        return { role: 'educador', id: e.id, nombre: e.nombre, turnos: String(e.turnos || '').split(',').filter(function (t) { return TURNO_IDS.indexOf(t) >= 0; }) };
      }
    }
    for (var j = 0; j < db.alumnos.length; j++) {
      var a = db.alumnos[j];
      if (a.pin && String(a.pin) === pin && a.estado !== 'Retirado') return { role: 'alumno', id: a.id, nombre: a.nombre, turnos: [a.turno] };
    }
    return null;
  }

  function vista(db, ses) {
    if (ses.role === 'dueno') {
      return { sesion: ses, config: db.config, alumnos: db.alumnos, asistencia: db.asistencia, pagos: db.pagos, educadores: db.educadores, notas: db.notas };
    }
    if (ses.role === 'alumno') {
      var yo = buscar(db.alumnos, ses.id);
      var eqA = db.educadores.filter(function (e) { return activo(e.activo) && String(e.turnos).split(',').indexOf(yo.turno) >= 0; }).map(function (e) { return { id: e.id, nombre: e.nombre, turnos: e.turnos }; });
      return {
        sesion: ses, config: { mensualidad: db.config.mensualidad, matricula: db.config.matricula, cuotas: db.config.cuotas, dias: db.config.dias },
        alumnos: [sinPin(yo)],
        asistencia: db.asistencia.filter(function (r) { return String(r.alumnoId) === String(yo.id); }),
        pagos: db.pagos.filter(function (p) { return String(p.alumnoId) === String(yo.id); }),
        educadores: eqA, notas: []
      };
    }
    var ids = {};
    var alumnos = db.alumnos.filter(function (a) { if (puede(ses, a.turno)) { ids[a.id] = 1; return true; } return false; })
      .map(function (a) { var o = {}; for (var k in a) if (k !== 'mensualidad' && k !== 'matricula' && k !== 'pin') o[k] = a[k]; return o; });
    var cfg = { mensualidad: db.config.mensualidad, cuotas: db.config.cuotas, dias: db.config.dias };
    var equipo = db.educadores.filter(function (e) { return activo(e.activo); }).map(function (e) { return { id: e.id, nombre: e.nombre, turnos: e.turnos }; })
      .filter(function (e) { return String(e.turnos).split(',').some(function (t) { return ses.turnos.indexOf(t) >= 0; }); });
    return {
      sesion: ses, config: cfg, alumnos: alumnos,
      asistencia: db.asistencia.filter(function (r) { return ids[r.alumnoId] && puede(ses, r.turno); }),
      pagos: [], educadores: equipo,
      notas: db.notas.filter(function (n) { return ids[n.alumnoId]; })
    };
  }

  var acciones = {
    datos: function (db, ses) { return vista(db, ses); },

    guardarAlumno: function (db, ses, d) {
      soloDueno(ses);

      if (TURNO_IDS.indexOf(d.turno) < 0) err('Elige un turno');
      var modulo = Math.min(6, Math.max(1, parseInt(d.modulo, 10) || 1));
      var fecha = esFecha(d.fechaInicio) ? d.fechaInicio : hoy();
      var a = d.id ? buscar(db.alumnos, d.id) : null;
      if (d.id && !a) err('No se encontró el alumno');
      if (!a) { a = { id: uid(), creado: hoy(), estado: 'Activo', notas: '' }; db.alumnos.push(a); }
      a.nombre = nombre; a.celular = txt(d.celular, 15).replace(/[^\d+]/g, ''); a.turno = d.turno;
      a.modulo = modulo; a.fechaInicio = fecha;
      if (d.mensualidad !== undefined) { var mp = Number(d.mensualidad); a.mensualidad = mp > 0 ? mp : ''; }
      if (d.matricula !== undefined) { var mm = Number(d.matricula); a.matricula = mm > 0 ? mm : ''; }
      if (d.estado === 'Activo' || d.estado === 'Retirado' || d.estado === 'Egresado') a.estado = d.estado;
      if (d.pagoMatricula) {
        db.pagos.push({ id: uid(), fecha: hoy(), alumnoId: a.id, concepto: 'Matrícula', monto: Number(d.montoMatricula) || Number(a.matricula) || Number(db.config.matricula) || 0, medio: MEDIOS.indexOf(d.medio) >= 0 ? d.medio : 'Efectivo', por: ses.nombre, ts: new Date().toISOString() });
      }
      return vista(db, ses);
    },

    cambiarModulo: function (db, ses, d) {
      var a = buscar(db.alumnos, d.alumnoId);
      if (!a || !puede(ses, a.turno)) err('No tienes acceso a este alumno');

      return vista(db, ses);
    },

    guardarAsistencia: function (db, ses, d) {
      if (!puede(ses, d.turno)) err('No tienes acceso a este turno');
      if (!esFecha(d.fecha)) err('Fecha no válida');

      var n = 0;

        var a = buscar(db.alumnos, r.alumnoId);
        if (!a || a.turno !== d.turno || ESTADOS.indexOf(r.estado) < 0) return;
        var ex = null;
        for (var i = 0; i < db.asistencia.length; i++) { var x = db.asistencia[i]; if (x.fecha === d.fecha && String(x.alumnoId) === String(a.id)) { ex = x; break; } }
        if (ex) { ex.estado = r.estado; ex.turno = d.turno; ex.por = ses.nombre; ex.ts = new Date().toISOString(); }
        else db.asistencia.push({ id: uid(), fecha: d.fecha, turno: d.turno, alumnoId: a.id, estado: r.estado, por: ses.nombre, ts: new Date().toISOString() });
        n++;
      });
      if (!n) err('No hay alumnos para guardar');
      return vista(db, ses);
    },

    agregarNota: function (db, ses, d) {
      var a = buscar(db.alumnos, d.alumnoId);

    registrarPago: function (db, ses, d) {
      soloDueno(ses);

      return vista(db, ses);
    },

    pinAlumno: function (db, ses, d) {
      soloDueno(ses);
      var a = buscar(db.alumnos, d.alumnoId);
      if (!a) err('No se encontró el alumno');

      if (!/^\d{6}$/.test(pin)) err('El PIN del alumno debe tener 6 números');
      if (pinEnUso(db, pin, a.id)) err('Ese PIN ya está en uso, elige otro');
      a.pin = pin;
      return vista(db, ses);
    },

    borrarPago: function (db, ses, d) {
      soloDueno(ses);
      db.pagos = db.pagos.filter(function (p) { return String(p.id) !== String(d.id); });
      return vista(db, ses);
    },

    guardarEducador: function (db, ses, d) {
      soloDueno(ses);
      var nombre = txt(d.nombre, 50);
      if (!nombre) err('Escribe el nombre del educador');
      var pin = txt(d.pin, 8);
      if (!/^\d{4,8}$/.test(pin)) err('El PIN debe tener de 4 a 8 números');
      if (pinEnUso(db, pin, d.id)) err('Ese PIN ya está en uso, elige otro');
      var turnos = (d.turnos || []).filter(function (t) { return TURNO_IDS.indexOf(t) >= 0; });
      if (!turnos.length) err('Asígnale al menos un turno');
      var e = d.id ? buscar(db.educadores, d.id) : null;
      if (!e) { e = { id: uid() }; db.educadores.push(e); }
      e.nombre = nombre; e.celular = txt(d.celular, 15).replace(/[^\d+]/g, ''); e.pin = pin; e.turnos = turnos.join(','); e.activo = d.activo === false ? false : true;
      return vista(db, ses);
    },

    borrarEducador: function (db, ses, d) {
      soloDueno(ses);
      db.educadores = db.educadores.filter(function (e) { return String(e.id) !== String(d.id); });
      return vista(db, ses);
    },

    guardarConfig: function (db, ses, d) {
      soloDueno(ses);

        if (db.educadores.some(function (e) { return String(e.pin) === p; }) || db.alumnos.some(function (a) { return a.pin && String(a.pin) === p; })) err('Ese PIN ya está en uso, elige otro');
        db.config.pinDueno = p;
      }
      return vista(db, ses);
    }
  };

  function ejecutar(db, pin, accion, datos) {
    var ses = auth(db, pin);
    if (!ses) err('PIN incorrecto');
    var fn = acciones[accion];
    if (!fn) err('Acción desconocida');
    return fn(db, ses, datos || {});
  }

  return { TURNO_IDS: TURNO_IDS, auth: auth, ejecutar: ejecutar, hoy: hoy, uid: uid, setHoy: function (f) { hoyFn = f; } };
})();

  plan.forEach((p,i)=>{
    const id='a'+(i+1); const ini=addD(H,-p[2]);
    db.alumnos.push({ id, nombre:nombres[i], celular:'9'+String(10000000+i*731).slice(0,8), turno:p[0], modulo:p[1], fechaInicio:ini, estado:'Activo', creado:ini, notas:'', mensualidad: i===4?220:'', pin: i===0?'123456':'' });
    if(i!==7 && i!==16) db.pagos.push({ id:'pm'+i, fecha:ini, alumnoId:id, concepto:'Matrícula', monto:59, medio:'Yape', por:'Dirección', ts:'' });
    const vencidas = Math.min(6, Math.floor(p[2]/28)+1);
    const pagadas = Math.max(0, vencidas - (i%4===1 ? 1 : 0) - (i===7?1:0));
    for(let k=0;k<pagadas;k++){ const due=addD(ini,28*k); db.pagos.push({ id:'pg'+i+'_'+k, fecha:(dEntre(due,H)<=12?H:due), alumnoId:id, concepto:'Mensualidad', monto:197, medio:k%2?'Efectivo':'Yape', por:'Dirección', ts:'' }); }
    const t = TMAP[p[0]];
    for(let d=1; d<=Math.min(p[2],24); d++){
      const f = addD(H,-d); if(!t.wd.includes(pISO(f).getDay())) continue;
      const r = rnd(); let e = r<0.78?'A':r<0.87?'T':r<0.96?'F':'J';
      if((i===3||i===13) && d<=7) e='F';
      db.asistencia.push({ id:'r'+i+'_'+d, fecha:f, turno:p[0], alumnoId:id, estado:e, por:'Demo', ts:'' });
    }
  });
  db.notas.push({ id:'n1', fecha:addD(H,-3), alumnoId:'a2', modulo:3, autor:'Profe Marco (demo)', texto:'Buen pulso en el low fade. Debe practicar la transición en la zona del parietal.' });
  db.notas.push({ id:'n2', fecha:addD(H,-6), alumnoId:'a12', modulo:2, autor:'Profe Rocío (demo)', texto:'Muy puntual. Ya domina guías y patillera; listo para cortes en tendencia con modelo.' });
  return db;
}

/* =================== CÁLCULOS =================== */
function activos(lista){ return lista.filter(a=>a.estado==='Activo'); }
function alumnosDe(turno){ return activos(S.data.alumnos).filter(a=>a.turno===turno).sort((a,b)=>a.nombre.localeCompare(b.nombre)); }
function regsDe(alumnoId){ return S.data.asistencia.filter(r=>r.alumnoId===alumnoId).sort((a,b)=>b.fecha.localeCompare(a.fecha)); }
function statsAsis(alumnoId){
  const rs = regsDe(alumnoId);
  const c = {A:0,T:0,F:0,J:0}; rs.forEach(r=>{ if(c[r.estado]!=null) c[r.estado]++; });
  let seguidas = 0; for(const r of rs){ if(r.estado==='F') seguidas++; else if(r.estado==='J') continue; else break; }
  const base = c.A+c.T+c.F;
  return { ...c, total: rs.length, pct: pct(c.A+c.T, base), seguidas, ultimos: rs.slice(0,8).reverse() };
}
function statsTurno(turno, dias=30){
  const desde = addD(hoy(), -dias);
  const ids = new Set(alumnosDe(turno).map(a=>a.id));
  const rs = S.data.asistencia.filter(r=>r.turno===turno && ids.has(r.alumnoId) && r.fecha>=desde);
  const p = rs.filter(r=>r.estado==='A'||r.estado==='T').length, base = rs.filter(r=>r.estado!=='J').length;
  return pct(p, base);
}
function asisGlobal(dias=30){
  const desde = addD(hoy(), -dias); const ids = new Set(activos(S.data.alumnos).map(a=>a.id));
  const rs = S.data.asistencia.filter(r=>ids.has(r.alumnoId) && r.fecha>=desde);
  return pct(rs.filter(r=>r.estado==='A'||r.estado==='T').length, rs.filter(r=>r.estado!=='J').length);
}
/* Turnos nuevos: no tienen clases antes de su fecha de inicio (en el recorrido de ejemplo no aplica) */
function inicioTurno(turno){ return MODO_RECORRIDO ? '' : (TMAP[turno]?.inicio || ''); }
function porIniciar(turno){ const i = inicioTurno(turno); return !!i && hoy() < i; }
function diasParaInicio(turno){ return Math.round((pISO(inicioTurno(turno)) - pISO(hoy()))/864e5); }
function txtFalta(turno){ const n = diasParaInicio(turno); return n===1 ? 'mañana' : 'faltan '+n+' días'; }
function badgeInicio(turno){ return porIniciar(turno) ? `<span class="badge b-ini">🚀 Inicia ${fDia(inicioTurno(turno))} ${fCorta(inicioTurno(turno))} · ${txtFalta(turno)}</span>` : ''; }
function avisoInicio(turno, extra=''){ if(!porIniciar(turno)) return ''; const i = inicioTurno(turno);
  return `<div class="ini-box"><span class="ini-ic" aria-hidden="true">🚀</span><div><b>Este turno todavía no empieza</b>
    <span>Se activa el <b style="color:var(--text)">${fLarga(i)}</b> (${txtFalta(turno)}). Antes de esa fecha no hay clases ni asistencia que marcar.${extra}</span></div></div>`; }
function hayClase(turno, f=hoy()){ const i = inicioTurno(turno); if(i && f < i) return false; return TMAP[turno].wd.includes(pISO(f).getDay()); }
function ultimaClase(turno){ let f=hoy(); for(let i=0;i<8;i++){ if(hayClase(turno,f)) return f; f=addD(f,-1);} return hoy(); }
function educadoresDe(turno){ return (S.data.educadores||[]).filter(e=>String(e.turnos).split(',').includes(turno) && e.activo!==false && e.activo!=='false'); }
function precioMens(a){ const v=Number(a?.mensualidad); return v>0 ? v : (Number(S.data.config.mensualidad)||197); }
function precioMat(a){ const v=Number(a?.matricula); return v>0 ? v : (Number(S.data.config.matricula)||59); }
function esPrecioEspecial(a){ return precioMens(a)!==(Number(S.data.config.mensualidad)||197) || precioMat(a)!==(Number(S.data.config.matricula)||59); }
/* Cronograma de cuotas desde la fecha de inicio: cada pago de mensualidad cubre la cuota más antigua pendiente */
function cronograma(a){
  const c = S.data.config, N = Number(c.cuotas)||6, D = Number(c.dias)||28, mens = precioMens(a), H = hoy();
  const pagos = S.data.pagos.filter(p=>p.alumnoId===a.id && p.concepto==='Mensualidad').sort((x,y)=>x.fecha.localeCompare(y.fecha));
  let siguienteMarcada = false;
  return Array.from({length:N}, (_,i)=>{
    const fecha = addD(a.fechaInicio, D*i), pago = pagos[i] || null, falta = dEntre(H, fecha);
    let st;
    if(pago) st = 'pagada';
    else if(falta < 0) st = 'vencida';
    else if(!siguienteMarcada){ st = falta===0 ? 'hoy' : 'proxima'; siguienteMarcada = true; }
    else st = 'pendiente';
    return { n:i+1, fecha, falta, monto: pago ? Number(pago.monto)||mens : mens, st, pago };
  });
}
const CRONO_ST = { pagada:['b-ok','✓ Pagada'], vencida:['b-bad','Vencida'], hoy:['b-warn','Vence hoy'], proxima:['b-gold','Próxima'], pendiente:['','Pendiente'] };
function estadoPago(a){
  const c = S.data.config; const mens = precioMens(a), mat = precioMat(a), N = Number(c.cuotas)||6, D = Number(c.dias)||28;
  const ps = S.data.pagos.filter(p=>p.alumnoId===a.id);
  const pagadas = ps.filter(p=>p.concepto==='Mensualidad').length;
  const matOk = ps.some(p=>p.concepto==='Matrícula');
  const dias = dEntre(a.fechaInicio, hoy());
  const vencidas = dias<0 ? 0 : Math.min(N, Math.floor(dias/D)+1);
  const proximo = pagadas>=N ? null : addD(a.fechaInicio, D*pagadas);
  const faltan = proximo ? dEntre(hoy(), proximo) : null;
  const deuda = Math.max(0, vencidas-pagadas)*mens + (matOk?0:mat);
  let estado, cls;
  if(pagadas>=N && matOk){ estado='Pagado completo'; cls='b-ok'; }
  else if(deuda>0 && (faltan==null || faltan<0 || !matOk)){ estado='Debe'; cls='b-bad'; }
  else if(faltan===0){ estado='Vence hoy'; cls='b-warn'; }
  else if(faltan!=null && faltan<=3){ estado=`Vence en ${faltan} día${faltan>1?'s':''}`; cls='b-warn'; }
  else { estado='Al día'; cls='b-ok'; }
  return { pagadas, N, matOk, vencidas, proximo, faltan, deuda, estado, cls, total: ps.reduce((s,p)=>s+Number(p.monto||0),0), pagos: ps.sort((x,y)=>y.fecha.localeCompare(x.fecha)) };
}
function alertas(){
  const out = [];
  activos(S.data.alumnos).forEach(a=>{
    const s = statsAsis(a.id);
    if(s.seguidas>=2) out.push({ tipo:'bad', ic:'🚨', a, t:`${a.nombre} faltó ${s.seguidas} clases seguidas`, d:`${tNombre(a.turno)} · Escríbele para que no abandone`, peso:3+s.seguidas });
    if(esDueno()){
      const p = estadoPago(a);
      if(p.estado==='Debe') out.push({ tipo:'warn', ic:'💸', a, t:`${a.nombre} debe ${soles(p.deuda)}`, d:`${!p.matOk?'Matrícula pendiente · ':''}${p.proximo?'Venció el '+fCorta(p.proximo):''}`, peso:2 });
      else if(p.cls==='b-warn') out.push({ tipo:'info', ic:'⏰', a, t:`${a.nombre}: ${p.estado.toLowerCase()} su mensualidad`, d:`${soles(S.data.config.mensualidad)} · ${tNombre(a.turno)}`, peso:1 });
    }
  });
  return out.sort((x,y)=>y.peso-x.peso);
}

/* ---------- Asistencia por turno y por fecha (dueño y educador) ---------- */
/* Clases de un alumno: todas las fechas de su turno desde su día de inicio (+ recuperaciones registradas) */
const quien = n => n==='Dirección' ? 'Director' : n;
function clasesAlumno(a, adelante=14){
  const H = hoy(), fin = addD(H, adelante), regs = {}; S.data.asistencia.filter(r=>r.alumnoId===a.id).forEach(r=>regs[r.fecha]=r);
  const fechas = new Set(); let f = a.fechaInicio || H, guard = 0;
  while(f<=fin && guard<500){ if(hayClase(a.turno,f)) fechas.add(f); f = addD(f,1); guard++; }
  Object.keys(regs).forEach(x=>fechas.add(x));
  const lista = [...fechas].sort().map((x,i)=>({ n:i+1, f:x, reg:regs[x]||null, fut:x>H, extra:!hayClase(a.turno,x) }));
  return lista;
}
function alumnosEnFecha(turno, f){ return alumnosDe(turno).filter(a=>!a.fechaInicio || a.fechaInicio<=f); }
function regsClase(turno, f){ return S.data.asistencia.filter(r=>r.turno===turno && r.fecha===f); }
function pendientesTurno(turno, dias=30){
  let n=0; for(let i=0;i<dias;i++){ const f=addD(hoy(),-i); if(hayClase(turno,f) && alumnosEnFecha(turno,f).length && !regsClase(turno,f).length) n++; } return n;
}
function vAsistPage(){
  const mios = misTurnos();
  if(!S.turno || !mios.includes(S.turno)) S.turno = mios.find(t=>hayClase(t)) || mios[0];
  if(!S.turno) return `<div class="notice warn">Todavía no tienes un turno asignado. Pide a la dirección que te asigne uno.</div>`;
  const t = TMAP[S.turno];
  return `<div class="page-title"><div><p class="kicker">Por turno y por fecha</p><h1>Asistencia</h1>
      <p>1) Elige el turno · 2) toca la fecha en el calendario · 3) marca a cada alumno y guarda. ${esDueno()?'Tú y el educador del turno pueden marcarla.':'La dirección también puede verla y corregirla.'}</p></div></div>
    <div class="as-turnos" role="group" aria-label="Turno">${mios.map(id=>{ const x=TMAP[id], n=alumnosDe(id).length, p=pendientesTurno(id); return `
      <button class="as-t" style="--tc:${x.color}" data-act="asTurno" data-t="${id}" aria-pressed="${id===S.turno}">
        <span class="ic">${x.ic}</span><span style="min-width:0"><b>${esc(x.dias)}</b><span>${esc(x.franja)} · ${n} alumno${n===1?'':'s'}</span></span>
        ${porIniciar(id)?`<span class="badge b-ini pend" title="Este turno todavía no empieza">${fCorta(inicioTurno(id))}</span>`:p?`<span class="badge b-warn pend" title="Clases sin asistencia en los últimos 30 días">${p}</span>`:''}
      </button>`; }).join('')}</div>
    ${vAsistencia(t, alumnosDe(t.id))}`;
}
function vAsistencia(t, als){
  if(!S.attFecha || S.attTurno!==t.id){ S.attFecha = ultimaClase(t.id); S.attTurno = t.id; S.attMes = S.attFecha.slice(0,7); S.att = cargarAtt(t.id, S.attFecha); }
  if(!S.attMes) S.attMes = S.attFecha.slice(0,7);
  if(porIniciar(t.id)){ const i = inicioTurno(t.id); S.attMes = i.slice(0,7);
    const n = alumnosDe(t.id).length;
    return avisoInicio(t.id, ` Ese día empiezas a marcar la asistencia aquí.`) + vCalendario(t) +
      `<div class="notice" style="margin-top:12px">👥 ${n ? `<b>${n} alumno${n===1?'':'s'}</b> ya ${n===1?'está inscrito':'están inscritos'} para el inicio.` : 'Todavía no hay alumnos inscritos para el inicio.'} ${esDueno()?'Puedes seguir agregando desde <b>+ Nuevo alumno</b>.':''}</div>`; }
  if(!alumnosDe(t.id).length) return `<div class="notice">El turno ${esc(tNombre(t.id))} todavía no tiene alumnos. ${esDueno()?'Agrégalos desde <b>+ Nuevo alumno</b>.':'La dirección los agregará.'}</div>`;
  return vCalendario(t) + vListaAsis(t);
}
function vCalendario(t){
  const H = hoy(), mes = S.attMes, [y,m] = mes.split('-').map(Number);
  const nDias = new Date(y, m, 0).getDate(), offset = (new Date(y, m-1, 1).getDay()+6)%7;
  const nombreMes = cap(new Date(y, m-1, 1).toLocaleDateString('es-PE',{month:'long', year:'numeric'}));
  let dadas=0, tomadas=0, pend=0, pres=0, base=0, cells='';
  for(let i=0;i<offset;i++) cells += '<span></span>';
  for(let d=1; d<=nDias; d++){
    const f = `${y}-${pad(m)}-${pad(d)}`, clase = hayClase(t.id,f), fut = f>H, regs = regsClase(t.id,f), hay = alumnosEnFecha(t.id,f).length>0;
    const p = regs.filter(r=>r.estado==='A'||r.estado==='T').length, b = regs.filter(r=>r.estado!=='J').length;
    let cls = clase ? 'clase' : '', lab = '';
    if(regs.length){ cls += clase?' ok':' extra'; lab = `${p}/${regs.length}`; tomadas++; pres+=p; base+=b; }
    else if(clase && !fut && hay){ cls += ' pend'; lab = '!'; pend++; }
    if(clase && !fut && hay) dadas++;
    if(f===inicioTurno(t.id)) { cls += ' ini'; lab = lab || '🚀'; }
    if(f===H) cls += ' hoy';
    if(f===S.attFecha) cls += ' sel';
    if(fut) cls += ' fut';
    cells += `<button class="cal-d ${cls}" data-act="calDia" data-f="${f}" ${fut?'disabled':''} aria-label="${fLarga(f)}${regs.length?', asistencia guardada':clase&&!fut?', pendiente':''}">${d}${lab?`<small>${lab}</small>`:''}</button>`;
  }
  const prom = pct(pres, base);
  return `<section class="cal" style="border-top:4px solid ${t.color}">
    <div class="cal-h">
      <button class="icon-btn" data-act="calMes" data-d="-1" aria-label="Mes anterior">‹</button>
      <div style="text-align:center"><h3>${nombreMes}</h3><div class="small muted">${t.ic} ${esc(tNombre(t.id))} · clases: ${t.wd.map(w=>['dom','lun','mar','mié','jue','vie','sáb'][w]).join(' y ')}</div></div>
      <button class="icon-btn" data-act="calMes" data-d="1" aria-label="Mes siguiente" ${mes>=(porIniciar(t.id)?inicioTurno(t.id):H).slice(0,7)?'disabled':''}>›</button>
    </div>
    <div class="cal-g">${['L','M','M','J','V','S','D'].map(w=>`<span class="cal-w">${w}</span>`).join('')}${cells}</div>
    <div class="cal-leg"><span><i style="background:rgba(92,201,138,.25)"></i>Tomada (presentes/total)</span><span><i style="background:rgba(240,180,60,.25)"></i>Pendiente</span><span><i style="background:var(--panel-2)"></i>Día de clase</span><span><i style="background:rgba(122,167,255,.2)"></i>Recuperación</span>${inicioTurno(t.id)?`<span><i style="background:rgba(46,196,182,.3);outline:2px solid #2ec4b6"></i>Inicio del turno (${fCorta(inicioTurno(t.id))})</span>`:''}</div>
    <div class="cal-sum">
      <div><b>${tomadas}<span style="font-size:14px;color:var(--muted)">/${dadas}</span></b><span>Clases tomadas</span></div>
      <div><b style="color:${pend?'var(--warn)':'var(--ok)'}">${pend}</b><span>Pendientes</span></div>
      <div><b style="color:${prom==null?'inherit':prom>=85?'var(--ok)':prom>=70?'var(--warn)':'var(--bad)'}">${prom==null?'—':prom+'%'}</b><span>Asistencia del mes</span></div>
    </div>
  </section>`;
}
function vListaAsis(t){
  const f = S.attFecha, esDia = hayClase(t.id, f), als = alumnosEnFecha(t.id, f), regs = regsClase(t.id, f);
  const yaTomada = regs.length>0, ultimo = regs.slice().sort((a,b)=>String(b.ts).localeCompare(String(a.ts)))[0];
  const c = {A:0,T:0,F:0,J:0}; let sin = 0;
  als.forEach(a=>{ const e=S.att[a.id]; if(e) c[e]++; else sin++; });
  return `<section class="as-day" id="asDay">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
      <div><p class="kicker" style="color:${t.color}">${t.ic} ${esc(tNombre(t.id))}</p>
        <h2 style="font-size:22px">${cap(fLarga(f))}</h2>
        <div style="margin-top:6px">${yaTomada?`<span class="badge b-ok">✓ Guardada</span>${ultimo&&ultimo.por?` <span class="small muted">por ${esc(quien(ultimo.por))}</span>`:''}`:'<span class="badge b-warn">Pendiente de marcar</span>'}</div></div>
      <details class="small" style="color:var(--muted)"><summary style="cursor:pointer;color:var(--gold-soft)">Otra fecha ›</summary>
        <input type="date" class="date-in" id="attFecha" value="${f}" max="${hoy()}" aria-label="Elegir otra fecha" style="margin-top:6px"></details>
    </div>
    ${!esDia?`<div class="notice warn" style="margin-top:10px">Este turno normalmente no tiene clase los ${fDia(f)}. Si fue una clase de recuperación, puedes marcarla igual.</div>`:''}
    ${!als.length?`<div class="notice" style="margin-top:10px">Ningún alumno de este turno había empezado todavía en esta fecha.</div>`:`
    <div class="att-sum">
      <div><b style="color:var(--ok)">${c.A}</b><span>Asistió</span></div>
      <div><b style="color:var(--warn)">${c.T}</b><span>Tarde</span></div>
      <div><b style="color:var(--bad)">${c.F}</b><span>Faltó</span></div>
      <div><b style="color:var(--info)">${c.J}</b><span>Justificó</span></div>
    </div>
    <div class="list-card">${als.map(a=>{ const m=MOD(a.modulo), e=S.att[a.id]; return `
      <div class="att-row" style="--mc:${m.color}">
        <div class="who"><span class="av">${esc(ini(a.nombre))}</span><div><b>${esc(a.nombre)}</b><div class="small muted">Módulo ${m.n} · ${esc(m.titulo)}</div></div></div>
        <div class="att-btns" role="group" aria-label="Asistencia de ${esc(a.nombre)}">
          ${['A','T','F','J'].map(k=>`<button data-act="marcar" data-id="${a.id}" data-e="${k}" aria-pressed="${e===k}"><i>${EST[k].ic}</i>${EST[k].t}</button>`).join('')}
        </div>
      </div>`;}).join('')}</div>
    <div class="sticky-save">
      <button class="btn btn-ghost btn-sm" data-act="todosPresentes" style="flex:1">✓ Todos asistieron</button>
      <button class="btn btn-gold" data-act="guardarAsis" style="flex:1.3">${sin?`Guardar (faltan ${sin})`:yaTomada?'Guardar cambios':'Guardar asistencia'}</button>
    </div>`}
  </section>`;
}
function cargarAtt(turno, fecha){
  const o = {}; S.data.asistencia.filter(r=>r.turno===turno && r.fecha===fecha).forEach(r=>o[r.alumnoId]=r.estado); return o;
}

function vHistorial(t, als){
  const fechas = [...new Set(S.data.asistencia.filter(r=>r.turno===t.id).map(r=>r.fecha))].sort().reverse().slice(0,10);
  if(!fechas.length) return `<div class="notice">Todavía no hay asistencias guardadas en este turno. Empieza en la pestaña <b>Asistencia</b>.</div>`;
  const mapa = {}; S.data.asistencia.forEach(r=>{ if(r.turno===t.id) mapa[r.alumnoId+'|'+r.fecha]=r.estado; });
  return `<p class="small muted" style="margin:0 0 10px">Últimas ${fechas.length} clases. <b style="color:var(--ok)">✓</b> asistió · <b style="color:var(--warn)">⏱</b> tarde · <b style="color:var(--bad)">✕</b> faltó · <b style="color:var(--info)">J</b> justificó</p>
    <div class="hist"><table>
      <thead><tr><th>Alumno</th>${fechas.map(f=>`<th>${fDia(f)}<br>${fCorta(f)}</th>`).join('')}<th>%</th></tr></thead>
      <tbody>${als.map(a=>{ const s=statsAsis(a.id); return `<tr>
        <td><button data-act="perfil" data-id="${a.id}" style="background:none;border:0;padding:0;text-align:left;font-weight:600">${esc(a.nombre)}</button></td>
        ${fechas.map(f=>{ const e=mapa[a.id+'|'+f]; return `<td><span class="cell ${e||'n'}">${e?EST[e].ic:'·'}</span></td>`;}).join('')}
        <td><b style="color:${s.pct==null?'inherit':s.pct>=85?'var(--ok)':s.pct>=70?'var(--warn)':'var(--bad)'}">${s.pct==null?'—':s.pct+'%'}</b></td></tr>`;}).join('')}</tbody>
    </table></div>`;
}

/* ---------- Alumnos ---------- */
function vAlumnos(){
  const mios = misTurnos();
  let lista = S.data.alumnos.filter(a=>mios.includes(a.turno));
  const q = S.buscar.trim().toLowerCase();
  if(S.filtroTurno!=='todos') lista = lista.filter(a=>a.turno===S.filtroTurno);
  if(S.filtroModulo) lista = lista.filter(a=>Number(a.modulo)===S.filtroModulo);
  if(q) lista = lista.filter(a=>a.nombre.toLowerCase().includes(q) || String(a.celular).includes(q));
  const act = lista.filter(a=>a.estado==='Activo').sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const otros = lista.filter(a=>a.estado!=='Activo');
  return `<div class="page-title"><div><p class="kicker">${esDueno()?'Toda la escuela':'Tus turnos'}</p><h1>Alumnos</h1><p>${act.length} activo${act.length===1?'':'s'}${otros.length?` · ${otros.length} retirado${otros.length===1?'':'s'} o egresado${otros.length===1?'':'s'}`:''}</p></div>
      ${esDueno()?`<button class="btn btn-gold btn-sm" data-act="nuevoAlumno">+ Nuevo</button>`:''}</div>
    <input class="search" id="buscar" type="search" placeholder="🔍  Buscar por nombre o celular" value="${esc(S.buscar)}" aria-label="Buscar alumno">
    ${mios.length>1?`<div class="chips" style="margin-top:12px">
      <button class="chip" data-act="fTurno" data-t="todos" aria-pressed="${S.filtroTurno==='todos'}">Todos los turnos</button>
      ${mios.map(id=>`<button class="chip" data-act="fTurno" data-t="${id}" aria-pressed="${S.filtroTurno===id}">${TMAP[id].ic} ${esc(tNombre(id))}</button>`).join('')}</div>`:''}
    <div class="chips" style="margin-top:8px">
      <button class="chip" data-act="fMod" data-m="0" aria-pressed="${!S.filtroModulo}">Todos los módulos</button>
      ${MODULOS.map(m=>`<button class="chip" data-act="fMod" data-m="${m.n}" aria-pressed="${S.filtroModulo===m.n}" style="${S.filtroModulo===m.n?`border-color:${m.color};color:${m.color};background:${m.color}1f`:''}">Módulo ${m.n}</button>`).join('')}</div>
    <div class="list-card" style="margin-top:14px">${act.length? act.map(a=>filaAlumno(a, `${esc(tNombre(a.turno))} · Módulo ${a.modulo}`)).join('') : `<p class="muted" style="padding:14px 0;margin:0">${q||S.filtroModulo||S.filtroTurno!=='todos'?'No hay alumnos con ese filtro.':'Todavía no hay alumnos. '+(esDueno()?'Toca <b>+ Nuevo</b> para inscribir al primero.':'')}</p>`}</div>
    ${otros.length?`<section class="sec"><div class="sec-h"><h2 class="muted">Retirados y egresados</h2></div><div class="list-card">${otros.map(a=>filaAlumno(a, `${a.estado} · ${esc(tNombre(a.turno))}`)).join('')}</div></section>`:''}`;
}

/* ---------- Pagos (dueño) ---------- */
function vPagos(){
  const d = S.data, act = activos(d.alumnos).map(a=>({a, p:estadoPago(a)}));
  const mes = hoy().slice(0,7);
  const delMes = d.pagos.filter(x=>x.fecha.slice(0,7)===mes);
  const cobrado = delMes.reduce((s,x)=>s+Number(x.monto||0),0);
  const deben = act.filter(x=>x.p.estado==='Debe').sort((x,y)=>y.p.deuda-x.p.deuda);
  const pronto = act.filter(x=>x.p.cls==='b-warn').sort((x,y)=>x.p.faltan-y.p.faltan);
  const ok = act.filter(x=>x.p.cls==='b-ok');
  const totalDeuda = deben.reduce((s,x)=>s+x.p.deuda,0);
  const esperado = act.reduce((x,{a})=>x+precioMens(a),0);
  const limite = addD(hoy(), 30);
  const proximos = [];
  act.forEach(({a})=>cronograma(a).forEach(k=>{ if((k.st==='hoy'||k.st==='proxima'||k.st==='pendiente') && k.fecha<=limite) proximos.push({a,k}); }));
  proximos.sort((x,y)=>x.k.fecha.localeCompare(y.k.fecha) || x.a.nombre.localeCompare(y.a.nombre));
  const totalProx = proximos.reduce((x,{k})=>x+k.monto,0);
  const dias = [...new Set(proximos.map(x=>x.k.fecha))];
  const fila = ({a,p}) => `<div class="st" style="--mc:${MOD(a.modulo).color}">
      <button data-act="perfil" data-id="${a.id}" style="display:contents;background:none;border:0;color:inherit;text-align:left">
        <span class="av">${esc(ini(a.nombre))}</span>
        <span class="nm"><b>${esc(a.nombre)}</b><span>${p.estado==='Debe'?`Debe ${soles(p.deuda)}${!p.matOk?' (incluye matrícula)':''}`:p.proximo?`Próximo pago: ${fCorta(p.proximo)}`:'Curso pagado'} · cuota ${Math.min(p.pagadas+1,p.N)}/${p.N}${esPrecioEspecial(a)?` · ⭐ ${soles(precioMens(a))}/mes`:''}</span></span>
      </button>
      ${p.cls!=='b-ok'||p.proximo?`<button class="btn btn-line btn-sm" data-act="nuevoPago" data-id="${a.id}">Cobrar</button>`:''}
    </div>`;
  return `<div class="page-title"><div><p class="kicker">Mensualidad estándar ${soles(d.config.mensualidad)} · cada 28 días</p><h1>Pagos</h1></div>
      <button class="btn btn-gold btn-sm" data-act="nuevoPago">+ Registrar</button></div>
    <div class="grid g2">
      <div class="stat" style="--c:var(--ok)"><div class="lab">Cobrado este mes</div><div class="val">${soles(cobrado)}</div><div class="hint">${delMes.length} pago${delMes.length===1?'':'s'} registrados</div></div>
      <div class="stat" style="--c:var(--bad)"><div class="lab">Deuda vencida</div><div class="val">${soles(totalDeuda)}</div><div class="hint">${deben.length} alumno${deben.length===1?'':'s'}</div></div>
    </div>
    <div class="card" style="margin-top:12px"><div class="small muted" style="display:flex;justify-content:space-between"><span>Avance de cobro del mes</span><b class="num">${pct(cobrado,esperado)??0}%</b></div>
      <div class="progress" style="margin-top:8px"><i style="width:${Math.min(100,pct(cobrado,esperado)||0)}%"></i></div>
      <div class="small dim" style="margin-top:6px">Si todos tus alumnos activos pagan su mensualidad: ${soles(esperado)}</div></div>
    <section class="sec"><div class="sec-h"><h2>🔴 Deben</h2><span class="badge b-bad">${deben.length}</span></div>
      <div class="list-card">${deben.length?deben.map(fila).join(''):'<p class="muted" style="margin:0;padding:14px 0">Nadie debe. 👏</p>'}</div></section>
    <section class="sec"><div class="sec-h"><h2>🟡 Vencen pronto</h2><span class="badge b-warn">${pronto.length}</span></div>
      <div class="list-card">${pronto.length?pronto.map(fila).join(''):'<p class="muted" style="margin:0;padding:14px 0">Ningún pago vence en los próximos 3 días.</p>'}</div></section>
    <section class="sec"><div class="sec-h"><h2>📅 Próximos cobros</h2><span class="badge b-gold">${soles(totalProx)}</span></div>
      <p class="small muted" style="margin:-6px 0 8px">Cuotas que vencen en los próximos 30 días, según la fecha de inicio de cada alumno.</p>
      <div class="list-card">${proximos.length ? dias.map(f=>{ const del = proximos.filter(x=>x.k.fecha===f), dd = dEntre(hoy(), f); return `
        <div class="agenda-day">${cap(fLarga(f))}<span>${dd===0?'Hoy':dd===1?'Mañana':`En ${dd} días`} · ${soles(del.reduce((x,{k})=>x+k.monto,0))}</span></div>
        ${del.map(({a,k})=>`<div class="st" style="--mc:${MOD(a.modulo).color}">
          <button data-act="perfil" data-id="${a.id}" style="display:contents;background:none;border:0;color:inherit;text-align:left">
            <span class="av">${esc(ini(a.nombre))}</span>
            <span class="nm"><b>${esc(a.nombre)}</b><span>Cuota ${k.n} de ${cronograma(a).length} · ${soles(k.monto)}${esPrecioEspecial(a)?' ⭐':''}</span></span>
          </button>
          <button class="btn btn-line btn-sm" data-act="nuevoPago" data-id="${a.id}">Cobrar</button></div>`).join('')}`; }).join('')
        : '<p class="muted" style="margin:0;padding:14px 0">No hay cuotas por vencer en los próximos 30 días.</p>'}</div></section>
    <section class="sec"><div class="sec-h"><h2>🟢 Al día</h2><span class="badge b-ok">${ok.length}</span></div>
      <div class="list-card">${ok.length?ok.map(fila).join(''):'<p class="muted" style="margin:0;padding:14px 0">—</p>'}</div></section>`;
}

function precioTotal(){
  const a = S.data.alumnos.find(x=>x.id===$('#precioForm')?.dataset.id); if(!a) return;
  const N = Number(S.data.config.cuotas)||6, mens = Number($('#prMens').value)||0, mat = Number($('#prMat').value)||0;

      <div class="field"><span class="lbl">Turnos que va a ver (puedes marcar varios)</span><div class="turn-pick">

      <div class="field"><label for="ePin">PIN de acceso (4 a 8 números)</label><input id="ePin" inputmode="numeric" maxlength="8" required value="${esc(pinNuevo)}"></div>
      ${e?`<label class="switch" style="margin-bottom:14px"><span><b>Acceso activo</b><br><span class="small muted">Apágalo si ya no trabaja en la escuela</span></span><input type="checkbox" id="eAct" ${e.activo!==false&&e.activo!=='false'?'checked':''}></label>`:''}
      <button class="btn btn-gold btn-block" type="submit">${e?'Guardar cambios':'Crear acceso'}</button>
      ${e?`<button class="btn btn-bad btn-block" type="button" style="margin-top:10px" data-act="borrarEdu" data-id="${e.id}">Eliminar educador</button>`:''}
    </form>`);
}

/* =================== ACCIONES =================== */
let ocupado = false;
async function ejecutar(accion, datos, msg){
  if(ocupado) return false; ocupado = true;
  const btns = $$('button[type=submit], .sticky-save .btn-gold'); btns.forEach(b=>b.disabled=true);
  try{ S.data = await API.call(accion, datos); if(msg) toast(msg); return true; }
  catch(e){ toast(e.message, true); return false; }
  finally{ ocupado=false; btns.forEach(b=>b.disabled=false); }
}
function toast(m, bad){ const t=$('#toast'); t.textContent=m; t.className='toast on'+(bad?' bad':''); clearTimeout(toast._t); toast._t=setTimeout(()=>t.className='toast'+(bad?' bad':''), 2600); }

async function entrar(pin){
  S.pin = pin;
  app.innerHTML = `<div class="loading"><div><div class="spin"></div>Entrando…</div></div>`;
  try{
    S.data = await API.call('datos');
    if(!MODO_RECORRIDO) lsSet('cfm_pin', pin);
    S.vista = esDueno() ? 'inicio' : esAlumno() ? 'mi' : 'turno'; S.tab = 'modulos'; S.turno = null; S.attFecha = null;
  }catch(e){ S.data=null; S.pin=''; lsSet('cfm_pin',''); render(); toast(e.message, true); return; }
  render();
}

app.addEventListener('submit', async e=>{

    if(ok && $('#cPin')?.value.trim()){ S.pin=$('#cPin').value.trim(); lsSet('cfm_pin',S.pin); }

});
app.addEventListener('input', e=>{

app.addEventListener('change', e=>{

sheet.addEventListener('submit', async e=>{
  e.preventDefault(); const f = e.target;
  if(f.id==='alumnoForm'){
    const turno = f.querySelector('input[name=fTurno]:checked')?.value;
    if(!turno){ toast('Elige un turno', true); return; }
    const d = { id:f.dataset.id||undefined, nombre:$('#fNom').value, celular:$('#fCel').value, turno, modulo:f.querySelector('input[name=fMod]:checked')?.value||1, fechaInicio:$('#fIni').value };
    const actual = f.dataset.id ? S.data.alumnos.find(x=>x.id===f.dataset.id) : null;
    if(actual) d.estado = actual.estado;
    const cfg = S.data.config, vM = Number($('#fMens').value), vMat = Number($('#fMatP').value);
    if(!(vM>0) || !(vMat>0)){ toast('Revisa los montos de mensualidad y matrícula', true); return; }
    d.mensualidad = vM===Number(cfg.mensualidad) ? 0 : vM;
    d.matricula = vMat===Number(cfg.matricula) ? 0 : vMat;
    if(!f.dataset.id && $('#fMat')?.checked){ d.pagoMatricula = true; d.montoMatricula = vMat; d.medio='Efectivo'; }
    if(await ejecutar('guardarAlumno', d, f.dataset.id?'Datos actualizados':'¡Alumno inscrito! 🎉')){ cerrarHoja(); render(); }
  }
  if(f.id==='precioForm'){
    const a = S.data.alumnos.find(x=>x.id===f.dataset.id); if(!a) return;
    const cfg = S.data.config, vM = Number($('#prMens').value), vMat = Number($('#prMat').value);
    if(!(vM>0) || !(vMat>0)){ toast('Escribe montos válidos', true); return; }
    const d = { ...a, mensualidad: vM===Number(cfg.mensualidad)?0:vM, matricula: vMat===Number(cfg.matricula)?0:vMat };
    if(await ejecutar('guardarAlumno', d, `Precio actualizado: ${soles(vM)} al mes`)){ hojaPerfil(a.id); render(); }
  }
  if(f.id==='pagoForm'){
    const d = { alumnoId:$('#pAl').value, concepto:f.querySelector('input[name=pCon]:checked')?.value, monto:$('#pMonto').value, fecha:$('#pFecha').value, medio:f.querySelector('input[name=pMed]:checked')?.value };
