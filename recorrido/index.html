document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch(act){
    case 'ir': S.vista = b.dataset.v; if(S.vista==='turno'){ S.tab='modulos'; } window.scrollTo(0,0); render(); break;
    case 'salir': if(confirmar('¿Cerrar sesión en este celular?')){ S.data=null; S.pin=''; lsSet('cfm_pin',''); render(); } break;
    case 'abrirTurno': S.turno=b.dataset.t; S.guiaMod=null; S.tab=b.dataset.tab||'modulos'; S.vista = S.tab==='asistencia' ? 'asistencia' : 'turno'; S.attFecha=null; S.attMes=null; window.scrollTo(0,0); render(); break;
    case 'cambiarTurno': S.turno=b.dataset.t; S.guiaMod=null; S.attFecha=null; render(); break;
    case 'tab': S.tab=b.dataset.tab; if(!esDueno()) S.vista = S.tab==='asistencia'?'asistencia':S.tab==='guia'?'guia':'turno'; render(); break;
    case 'guiaMod': S.guiaMod=Number(b.dataset.m); render(); break;
    case 'attDia': S.attFecha=b.dataset.f; S.att=cargarAtt(S.turno,S.attFecha); render(); break;
    case 'verClases': S.verClases = S.verClases===id ? null : id; hojaPerfil(id); break;
    case 'marcarUno': {
      const a = S.data.alumnos.find(x=>x.id===id); if(!a) break;
      const ya = S.data.asistencia.find(r=>r.alumnoId===id && r.fecha===b.dataset.f);
      if(ya && ya.estado===b.dataset.e) break;
      const sc = sheet.querySelector('.sheet')?.scrollTop||0;
      if(await ejecutar('guardarAsistencia', { turno:a.turno, fecha:b.dataset.f, registros:[{alumnoId:id, estado:b.dataset.e}] }, `${fCorta(b.dataset.f)}: ${EST[b.dataset.e].t}`)){ hojaPerfil(id); const sh=sheet.querySelector('.sheet'); if(sh) sh.scrollTop=sc; if(S.attTurno===a.turno) S.att=cargarAtt(S.turno,S.attFecha); render(); }
      break; }
    case 'asTurno': S.turno=b.dataset.t; S.attFecha=null; S.attMes=null; render(); break;
    case 'calMes': { const [yy,mm]=S.attMes.split('-').map(Number); const dd=new Date(yy, mm-1+Number(b.dataset.d), 1); S.attMes=dd.getFullYear()+'-'+pad(dd.getMonth()+1); render(); break; }
    case 'calDia': S.attFecha=b.dataset.f; S.attMes=S.attFecha.slice(0,7); S.att=cargarAtt(S.turno,S.attFecha); render(); setTimeout(()=>$('#asDay')?.scrollIntoView({behavior:'smooth',block:'start'}),30); break;
    case 'marcar': S.att[id] = S.att[id]===b.dataset.e ? undefined : b.dataset.e; if(!S.att[id]) delete S.att[id]; render(); break;
    case 'todosPresentes': alumnosEnFecha(S.turno, S.attFecha).forEach(a=>{ if(!S.att[a.id]) S.att[a.id]='A'; }); render(); toast('Marcados como asistió. Corrige a los que faltaron.'); break;
    case 'guardarAsis': {
      const als = alumnosEnFecha(S.turno, S.attFecha); const regs = als.filter(a=>S.att[a.id]).map(a=>({alumnoId:a.id, estado:S.att[a.id]}));
      if(!regs.length){ toast('Marca al menos a un alumno', true); break; }
      const sin = als.length - regs.length;
      if(sin && !confirmar(`Faltan ${sin} alumno${sin>1?'s':''} por marcar. ¿Guardar igual?`)) break;
      if(await ejecutar('guardarAsistencia', { turno:S.turno, fecha:S.attFecha, registros:regs }, 'Asistencia guardada ✅')){ S.att=cargarAtt(S.turno,S.attFecha); render(); }
      break; }
    case 'fTurno': S.filtroTurno=b.dataset.t; render(); break;
    case 'fMod': S.filtroModulo=Number(b.dataset.m); render(); break;
    case 'perfil': hojaPerfil(id); break;
    case 'cerrar': cerrarHoja(); break;
    case 'nuevoAlumno': hojaAlumno(null, b.dataset.t); break;
    case 'editAlumno': hojaAlumno(id); break;
    case 'modulo': {
      const a = S.data.alumnos.find(x=>x.id===id);
      if(await ejecutar('cambiarModulo', { alumnoId:id, modulo:b.dataset.m }, `${a?a.nombre.split(' ')[0]:'Alumno'} pasó al módulo ${b.dataset.m}`)){ hojaPerfil(id); render(); }
      break; }
    case 'estadoAlumno': {
      const a = S.data.alumnos.find(x=>x.id===id); if(!a) break;
      const e2 = b.dataset.e; if(e2!=='Activo' && !confirmar(`¿Marcar a ${a.nombre} como ${e2.toLowerCase()}? Ya no aparecerá en su turno.`)) break;
      if(await ejecutar('guardarAlumno', { ...a, estado:e2 }, e2==='Activo'?'Alumno reactivado':`Marcado como ${e2.toLowerCase()}`)){ cerrarHoja(); render(); }
      break; }
    case 'nuevoPago': hojaPago(id); break;
    case 'precio': hojaPrecio(id); break;
    case 'prQuick': $('#prMens').value = b.dataset.v; precioTotal(); break;
    case 'prEstandar': $('#prMens').value = S.data.config.mensualidad; $('#prMat').value = S.data.config.matricula; precioTotal(); break;
    case 'borrarPago': if(confirmar('¿Borrar este pago?') && await ejecutar('borrarPago', { id }, 'Pago borrado')){ hojaPerfil(b.dataset.al); render(); } break;
    case 'nuevoEdu': hojaEdu(null); break;
    case 'editEdu': hojaEdu(id); break;
    case 'borrarEdu': if(confirmar('¿Eliminar a este educador? Ya no podrá entrar.') && await ejecutar('borrarEducador', { id }, 'Educador eliminado')){ cerrarHoja(); render(); } break;
    case 'verPin': S.verPin[id]=!S.verPin[id]; render(); break;
    case 'tour': tourAbrir(0); break;
    case 'tourSig': tourAbrir(tourI+1); break;
    case 'tourAtras': tourAbrir(Math.max(0,tourI-1)); break;
    case 'tourFin': tourCerrar(); window.scrollTo(0,0); break;
    case 'temMod': S.temMod = Number(b.dataset.m); render(); break;
    case 'verTemario': S.temMod = Number(b.dataset.m)||null; S.vista='temario'; window.scrollTo(0,0); render(); break;
    case 'verPinAl': S.verPinAl = S.verPinAl===id ? null : id; hojaPerfil(id); break;
    case 'pinAl': {
      const a = S.data.alumnos.find(x=>x.id===id); if(!a) break;
      if(a.pin && !confirmar(`¿Cambiar el PIN de ${a.nombre}? El PIN anterior dejará de funcionar.`)) break;
      const usados = new Set([String(S.data.config.pinDueno), ...S.data.educadores.map(e=>String(e.pin)), ...S.data.alumnos.map(x=>String(x.pin||''))]);
      let pin; do { pin = String(100000 + Math.floor(Math.random()*900000)); } while(usados.has(pin));
      if(await ejecutar('pinAlumno', { alumnoId:id, pin }, `Acceso creado para ${a.nombre.split(' ')[0]}. Envíale su PIN 📲`)){ S.verPinAl = id; hojaPerfil(id); render(); }
      break; }
    case 'pinAlQuitar': {
      const a = S.data.alumnos.find(x=>x.id===id); if(!a) break;
      if(!confirmar(`¿Quitar el acceso de ${a.nombre}? Ya no podrá entrar con su PIN.`)) break;
      if(await ejecutar('pinAlumno', { alumnoId:id, quitar:true }, 'Acceso quitado')){ hojaPerfil(id); render(); }
      break; }
    case 'reiniciarDemo': if(confirmar('¿Borrar los cambios y volver a los datos de ejemplo?')){ lsSet(DEMO_KEY, semilla()); S.data = await API.call('datos'); toast('Datos de ejemplo cargados'); render(); } break;
  }
});
function confirmar(m){ try{ return window.confirm(m); }catch(e){ return true; } }

function linkInscripcion(){ return waLink(WA_ESCUELA, '[RECORRIDO - QUIERO INSCRIBIRME] Hola, vi el recorrido de la plataforma del alumno y quiero inscribirme en el curso de barbería. ¿Qué turnos tienen disponibles?'); }
function semillaRecorrido(){
  const H = hoy(), ini = (()=>{ let f = addD(H,-38); while(pISO(f).getDay()!==6) f = addD(f,-1); return f; })();
  const db = { config:{ pinDueno:'__no__', mensualidad:197, matricula:59, cuotas:6, dias:28, meta:100 }, alumnos:[], asistencia:[], pagos:[], notas:[],
    educadores:[{ id:'e1', nombre:'Tu educador', celular:'', pin:'__edu__', turnos:'SD-M', activo:true }] };
  db.alumnos.push({ id:'yo', nombre:'Diego Ramírez', celular:'', turno:'SD-M', modulo:2, fechaInicio:ini, estado:'Activo', creado:ini, notas:'', mensualidad:'', matricula:'', pin:'777777' });
  db.pagos.push({ id:'p0', fecha:ini, alumnoId:'yo', concepto:'Matrícula', monto:59, medio:'Yape', por:'Dirección', ts:'' });
  db.pagos.push({ id:'p1', fecha:ini, alumnoId:'yo', concepto:'Mensualidad', monto:197, medio:'Yape', por:'Dirección', ts:'' });
  db.pagos.push({ id:'p2', fecha:addD(ini,28), alumnoId:'yo', concepto:'Mensualidad', monto:197, medio:'Efectivo', por:'Dirección', ts:'' });
  let f = ini, n = 0;
  while(f <= H){ if(pISO(f).getDay()===6 || pISO(f).getDay()===0){ n++; db.asistencia.push({ id:'r'+n, fecha:f, turno:'SD-M', alumnoId:'yo', estado: n===4?'T':n===7?'F':'A', por:'Tu educador', ts:'' }); } f = addD(f,1); }
  return db;
}
const TOUR = [
  { v:'mi', sel:null, ic:'💈', t:'Bienvenido a tu plataforma', p:'Así vas a ver tu curso en Callao For Men desde tu celular, todos los días. Te lo muestro en 30 segundos.' },
  { v:'mi', sel:'.t-hero', t:'Tu turno y tu avance', p:'Ves tu turno, tu educador, en qué módulo vas (de 6), tu porcentaje de asistencia y cuántas cuotas llevas pagadas.' },
  { v:'mi', sel:'main .grid.g2', t:'Tu próxima clase y tu próximo pago', p:'Siempre sabes cuándo te toca clase y cuándo vence tu siguiente cuota. Sin sorpresas.' },
  { v:'temario', sel:'.g-mods', t:'Tus 6 módulos y 48 clases', p:'Un módulo por mes, 8 clases de 3 horas cada uno. Toca cualquier módulo para ver qué vas a aprender en cada clase y qué debes traer.' },
  { v:'temario', sel:'.g-list', t:'Clase por clase', p:'Desde los fundamentos y el afeitado hasta degradados, diseños, freestyle y el examen final con certificado.' },
  { v:'mispagos', sel:'.price-card', t:'Tu cronograma de pagos', p:'Matrícula S/ 59 y S/ 197 por cada módulo, un módulo por mes. Ves cada cuota con su fecha, cuánto pagaste y cuánto te falta.' },
  { v:'misclases', sel:'.cl-list', t:'Tu asistencia', p:'Tu educador marca cada clase. Tú ves si asististe, llegaste tarde o faltaste, y tu porcentaje.' },
  { v:'mi', sel:null, ic:'✂️', t:'¿Listo para empezar?', p:'Separa tu vacante hoy. Escríbenos y te decimos los turnos disponibles: mañana, tarde o fin de semana.', fin:true }
];
let tourI = -1;
function tourAbrir(i){
  tourI = i; const st = TOUR[i]; if(!st) return tourCerrar();
  if(S.vista !== st.v){ S.vista = st.v; if(st.v==='temario') S.temMod = null; render(); }
  let ov = $('#tour'); if(!ov){ ov = document.createElement('div'); ov.id='tour'; ov.className='tour-ov'; document.body.appendChild(ov); }
  ov.className = 'tour-ov on';
  const el = st.sel ? $(st.sel) : null;
  const dots = TOUR.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
  const btns = st.fin
    ? `<button class="tc-skip" data-act="tourFin">Seguir mirando</button><a class="btn btn-wa" target="_blank" rel="noopener" href="${linkInscripcion()}" data-act="tourFin">Quiero inscribirme</a>`
    : `<button class="tc-skip" data-act="tourFin">${i===0?'Ver por mi cuenta':'Saltar'}</button>${i>0?`<button class="btn btn-ghost" data-act="tourAtras">Atrás</button>`:''}<button class="btn btn-gold" data-act="tourSig">${i===0?'Empezar':'Siguiente'}</button>`;
  ov.innerHTML = `<div class="tour-hole" style="${el?'':'display:none'}"></div>
    <div class="tour-card ${el?'':'center'}" role="dialog" aria-modal="true" aria-label="${esc(st.t)}">
      ${st.ic?`<div class="tc-big">${st.ic}</div>`:''}
      ${el?`<div class="tc-step">Paso ${i} de ${TOUR.length-2}</div>`:''}
      <h3>${esc(st.t)}</h3><p>${esc(st.p)}</p>
      <div class="tc-dots">${dots}</div>
      <div class="tc-btns">${btns}</div>
    </div>`;
  if(!el){ ov.style.background='rgba(5,4,2,.8)'; return; }
  ov.style.background='transparent';
  el.scrollIntoView({ block:'center' });
  requestAnimationFrame(()=>setTimeout(()=>{
    const r = el.getBoundingClientRect(), hole = ov.querySelector('.tour-hole'), card = ov.querySelector('.tour-card');
    const pad = 6, vh = innerHeight;
    const top = Math.max(8, r.top - pad), h = Math.min(r.height + pad*2, vh - 200);
    Object.assign(hole.style, { left:(r.left-pad)+'px', top:top+'px', width:(r.width+pad*2)+'px', height:h+'px' });
    const espacioAbajo = vh - (top + h);
    if(espacioAbajo > card.offsetHeight + 24){ card.style.top = (top + h + 14)+'px'; card.style.bottom='auto'; }
    else if(top > card.offsetHeight + 24){ card.style.top = 'auto'; card.style.bottom = (vh - top + 14)+'px'; }
    else { card.style.top='auto'; card.style.bottom='14px'; }
  }, 60));
}
function tourCerrar(){ tourI = -1; const ov = $('#tour'); if(ov){ ov.className='tour-ov'; ov.innerHTML=''; ov.style.background='transparent'; } }
addEventListener('resize', ()=>{ if(tourI>=0) tourAbrir(tourI); });

        sessionStorage.setItem('cfm_upd_'+m[1], '1');

      }
    }).catch(()=>{});
  }catch(e){}
})();
